[package]
name = "sql-splitter-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Browser playground bindings: profile a SQL dump and generate synthetic data via WASM"

[lib]
# rlib alongside cdylib so `cargo test` runs the same code natively
crate-type = ["cdylib", "rlib"]

# wasm-pack's bundled binaryen (117) rejects the wasm features current rustc
# emits; the `just wasm` recipe runs a system wasm-opt instead when installed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
sql-splitter = { path = "../..", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# getrandom is only reachable through seed fallbacks we never hit (every call
# passes an explicit seed), but it must still link on wasm32. Both major
# versions are in the tree: 0.4 via rand 0.10, 0.3 via ahash/tempfile.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
