[workspace]
members = [".", "crates/sql-splitter-wasm"]
exclude = ["fuzz"]
resolver = "2"

[package]
name = "sql-splitter"
version = "1.21.0"
edition = "2021"
authors = ["Helge Sverre <helge.sverre@gmail.com>"]
description = "High-performance CLI tool for splitting large SQL dump files into individual table files"
license = "MIT"
repository = "https://github.com/helgesverre/sql-splitter"
homepage = "https://github.com/helgesverre/sql-splitter"
keywords = ["sql", "mysql", "dump", "split", "cli"]
categories = ["command-line-utilities", "database"]
exclude = [
  "website/",
  "docs/",
  "scripts/",
  "docker/",
  "skills/",
  "man/",
  "tests/realworld/",
  "tests/data/generated/",
  "tests/fixtures/generated/",
]

[[bin]]
name = "sql-splitter"
path = "src/main.rs"

[[bin]]
name = "sql-splitter-migration-spike"
path = "src/bin/sql-splitter-migration-spike.rs"
required-features = ["enterprise-migration-spike"]

[features]
default = ["duckdb-query", "compression", "archive"]
duckdb-query = ["dep:duckdb", "dep:dirs", "dep:rustyline", "compression"]
compression = ["dep:flate2", "dep:bzip2", "dep:xz2", "dep:zstd"]
archive = ["compression", "dep:tar", "dep:zip", "dep:crc32fast"]
man-pages = ["dep:clap_mangen"]
enterprise-migration-spike = [
  "dep:bytes",
  "dep:fallible-iterator",
  "dep:native-tls",
  "dep:postgres",
  "dep:postgres-native-tls",
  "dep:toml",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
glob = "0.3"
regex = "1"
memchr = "2"
once_cell = "1"
ahash = "0.8"
anyhow = "1"
flate2 = { version = "1", optional = true }
bzip2 = { version = "0.6", optional = true }
xz2 = { version = "0.1", optional = true }
zstd = { version = "0.13", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "8", optional = true, default-features = false, features = ["deflate"] }
crc32fast = { version = "1", optional = true }
indicatif = "0.18"
rand = "0.10"
rand_chacha = "0.10"
smallvec = { version = "1.13", features = ["union"] }
chrono = "0.4"
chrono-tz = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
toml = { version = "0.9", optional = true }
postgres = { version = "0.19", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
fallible-iterator = { version = "0.2", optional = true }
bytes = { version = "1", optional = true }
fake = { version = "5", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
duckdb = { version = "1.10503", features = ["bundled"], optional = true }
dirs = { version = "6", optional = true }
rustyline = { version = "17", optional = true }
schemars = "1"
clap_mangen = { version = "0.3", optional = true }

# Unix-only: a real, best-effort process-level Ctrl-C (SIGINT) handler and
# explicit file-mode control for protected temporary files. `libc` is already
# present transitively; declaring it directly keeps the dependency honest.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
jsonschema = "0.49"

# Unix-only test support: set the umask and inspect file modes to prove the
# protected-output permission guarantees.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "writer_bench"
harness = false

[[bench]]
name = "e2e_bench"
harness = false

[[bench]]
name = "convert_bench"
harness = false

[[bench]]
name = "redact_bench"
harness = false

[[bench]]
name = "sample_bench"
harness = false

[[bench]]
name = "generate_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
incremental = false
strip = true

# Profile for cargo-dist builds
[profile.dist]
inherits = "release"

# Profile for flamegraph/samply profiling (release + debug symbols)
[profile.profiling]
inherits = "release"
debug = true
strip = false
